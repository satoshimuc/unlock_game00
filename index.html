<html lang="ja">
<head>

    <style>
        /* --- デザイン設定 --- */
        :root {
            --bg-dots: radial-gradient(#bae6fd 20%, transparent 20%);
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #ffffff;
            color: #334155;
            touch-action: manipulation;
            user-select: none;
            overflow-x: hidden;
        }

        /* 背景装飾 */
        .bg-pattern-dots {
            background-color: #ffffff;
            background-image: var(--bg-dots);
            background-size: 20px 20px;
            opacity: 0.4;
        }
        .wave-decoration {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60px;
            background: repeating-linear-gradient(-45deg, #fef08a, #fef08a 10px, #fde047 10px, #fde047 20px);
            mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 1200 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z' opacity='.5'/%3E%3C/svg%3E");
            mask-size: cover; mask-repeat: no-repeat; opacity: 0.8; z-index: -1;
        }

        /* アニメーション */
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-gentle { animation: bounce-gentle 3s ease-in-out infinite; }

        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes stamp-seal {
            0% { transform: scale(3) rotate(-20deg); opacity: 0; }
            80% { transform: scale(0.8) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-stamp { animation: stamp-seal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

        /* UIコンポーネント */
        .btn-beanbag {
            border-radius: 9999px; border-bottom-width: 6px; transition: all 0.1s; position: relative; overflow: hidden;
        }
        .btn-beanbag:active { transform: translateY(4px); border-bottom-width: 2px; }
        .btn-beanbag::after {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed rgba(255,255,255,0.4); border-radius: 9999px; pointer-events: none;
        }
        .card-pop {
            background: white; border-radius: 30px; box-shadow: 0 10px 0 #e2e8f0; border: 2px solid #f1f5f9;
        }
        .text-outline {
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 難易度選択ボタン用 */
        .level-btn {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .level-btn.selected {
            background-color: #f0f9ff;
            border-color: #3b82f6;
            transform: scale(1.02);
            box-shadow: 0 4px 0 #bfdbfe;
        }
        .level-btn:not(.selected) {
            opacity: 0.7;
            background-color: #f8fafc;
            border-color: #e2e8f0;
        }

        /* カレンダー */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .calendar-day {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 0.9rem; font-weight: 700; color: #94a3b8; position: relative;
        }
        .calendar-day.stamped {
            background-color: #fef08a; color: #854d0e; box-shadow: 0 2px 0 #fde047;
        }
        .stamp-mark {
            position: absolute; font-size: 1.2rem; color: #ef4444;
            filter: drop-shadow(0 2px 0 rgba(255,255,255,0.5)); animation: stamp-seal 0.3s forwards;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center relative">

    <!-- 背景装飾 -->
    <div class="absolute inset-0 bg-pattern-dots -z-20"></div>
    <div class="absolute top-10 left-[-20px] w-24 h-24 bg-red-400 rounded-full opacity-20 animate-bounce-gentle" style="animation-delay: 0s;"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="w-full max-w-md h-full flex flex-col relative px-5 py-4 z-10 overflow-y-auto no-scrollbar">
        
        <!-- Header -->
        <header id="app-header" class="hidden justify-between items-center mb-4 animate-pop pt-2">
            <div class="flex items-center gap-2" onclick="app.switchView('lp')">
                <span class="text-2xl font-black tracking-tighter text-slate-800 cursor-pointer">UNLOCK</span>
            </div>
            <div class="flex gap-2">
                <button onclick="app.switchView('calendar')" class="text-xs font-bold bg-white px-3 py-1.5 rounded-full border-2 border-slate-100 text-blue-500 shadow-sm active:scale-95 transition-transform">
                    <i class="fa-solid fa-calendar-days mr-1"></i>記録
                </button>
                <div class="text-xs font-bold bg-white px-3 py-1.5 rounded-full border-2 border-slate-100 text-slate-500 shadow-sm">
                    <span id="date-display">--.--</span>
                </div>

        </header>

        <!-- 0. LP VIEW -->
        <div id="view-lp" class="hidden flex-1 flex-col justify-center items-center animate-pop relative pb-10">
            <div class="text-center mb-8 relative">

                    <div class="flex justify-center items-center relative h-32 w-32 mx-auto animate-bounce-gentle">

            <div class="w-full flex flex-col gap-3">

    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        /** App Config */
        const AppConfig = { gameDuration: 30, storageBaseKey: 'unlock_data_v3_' };

        // Game Definitions
        const GameData = [
            { id: 'stroop', title: '色と言葉', desc: '「色」か「言葉」か、瞬時に見極めよう！', rule: '正解のボタンを押してね！' },
            { id: 'direction', title: 'あべこべナビ', desc: '矢印の向きと「同じ」か「逆」か。', rule: '指示通りに入力してね！' },
            { id: 'math_reflex', title: 'ぐうすう？', desc: '数字を見て直感で仕分け！偶数か奇数か？', rule: '偶数か奇数か選んでね！' }
        ];

        /** User Data Manager */
        const UserData = {
            userId: 'guest',
            setUserId: function(id) { this.userId = id || 'guest'; },
            getKey: function() { return AppConfig.storageBaseKey + this.userId; },
            load: function() {
                const raw = localStorage.getItem(this.getKey());
                return raw ? JSON.parse(raw) : { dates: [], lastScore: 0 };
            },
            save: function(data) { localStorage.setItem(this.getKey(), JSON.stringify(data)); },
            hasPlayedToday: function() {
                const data = this.load();
                return data.dates.includes(new Date().toDateString());
            },
            recordPlay: function(score) {
                const data = this.load();
                const today = new Date().toDateString();
                if (!data.dates.includes(today)) data.dates.push(today);
                data.lastScore = score;
                this.save(data);
            }
        };

        /** App Logic */
        const app = {
            state: {
                currentView: 'loading',
                score: 0,
                timeLeft: AppConfig.gameDuration,
                isPlaying: false,
                todayGameIndex: 0,
                timerInterval: null,
                difficulty: 'normal' // easy, normal, pro
            },

            init: async function() {
                this.updateDateDisplay();
                const today = new Date();
                this.state.todayGameIndex = (today.getFullYear() + today.getMonth() + today.getDate()) % GameData.length;
                this.switchView('lp');
            },

            checkLoginAndStart: function() {
                if (UserData.hasPlayedToday()) this.switchView('limit');
                else this.switchView('home');
            },

            updateDateDisplay: function() {
                const now = new Date();
                document.getElementById('date-display').innerText = now.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit', weekday: 'short' });
            },

            setDifficulty: function(level) {
                this.state.difficulty = level;
                // UI update
                ['easy', 'normal', 'pro'].forEach(l => {
                    const btn = document.getElementById(`btn-${l}`);
                    if(l === level) btn.classList.add('selected');
                    else btn.classList.remove('selected');
                });
            },

            setupHome: function() {
                const game = GameData[this.state.todayGameIndex];
                document.getElementById('daily-title').innerText = game.title;
                document.getElementById('daily-desc').innerText = game.desc;
                document.getElementById('game-rule-text').innerText = game.rule;
                this.setDifficulty('normal'); // Reset to normal on load
            },

            switchView: function(viewName) {
                const header = document.getElementById('app-header');
                if (['home', 'game', 'result', 'limit', 'calendar'].includes(viewName)) {
                    header.classList.remove('hidden'); header.classList.add('flex');
                } else {
                    header.classList.add('hidden'); header.classList.remove('flex');
                }
                
                if (viewName === 'home') this.setupHome();
                if (viewName === 'calendar') this.renderCalendar();

                ['loading', 'lp', 'home', 'game', 'result', 'limit', 'calendar'].forEach(v => {
                    const el = document.getElementById(`view-${v}`);
                    if (v === viewName) { el.classList.remove('hidden'); if(v!=='loading') el.classList.add('flex'); }
                    else { el.classList.add('hidden'); el.classList.remove('flex'); }
                });
                this.state.currentView = viewName;
            },

            startGame: function() {
                this.switchView('game');
                this.state.score = 0;
                this.state.timeLeft = AppConfig.gameDuration;
                document.getElementById('score-display').innerText = 0;
                
                // Show difficulty badge
                const diffLabel = { easy: '初級', normal: '中級', pro: 'プロ級' };
                document.getElementById('game-level-badge').innerText = `LEVEL: ${diffLabel[this.state.difficulty]}`;

                const overlay = document.getElementById('instruction-overlay');
                overlay.style.display = 'flex';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    this.state.isPlaying = true;
                    this.startTimer();
                    this.nextRound();
                }, 2000);
            },

            startTimer: function() {
                const timerBar = document.getElementById('timer-bar');
                timerBar.className = "h-full rounded-full transition-all duration-1000 ease-linear shadow-sm bg-gradient-to-r from-green-400 to-green-500";
                this.state.timerInterval = setInterval(() => {
                    this.state.timeLeft--;
                    const pct = (this.state.timeLeft / AppConfig.gameDuration) * 100;
                    timerBar.style.width = `${pct}%`;
                    if (this.state.timeLeft <= 10) timerBar.className = "h-full rounded-full transition-all duration-1000 ease-linear shadow-sm bg-gradient-to-r from-red-400 to-red-500";
                    if (this.state.timeLeft <= 0) this.endGame();
                }, 1000);
            },

            nextRound: function() {
                if (!this.state.isPlaying) return;
                const gameType = GameData[this.state.todayGameIndex].id;
                const stage = document.getElementById('stimulus-container');
                const controls = document.getElementById('controls-area');
                stage.innerHTML = ''; controls.innerHTML = '';

                // Switch logic based on Difficulty
                if (gameType === 'stroop') this.renderStroop(stage, controls);
                else if (gameType === 'direction') this.renderDirection(stage, controls);
                else if (gameType === 'math_reflex') this.renderMath(stage, controls);
            },

            // --- Game Logic with Difficulty ---
            renderStroop: function(stage, controls) {
                // Easy: 2色, シンプル. Normal: 4色. 
                // Pro: 4色 + 文字回転/反転 + ボタン位置シャッフル
                const allColors = [
                    { name: 'あか', code: 'text-red-500', bg: 'bg-red-400', border: 'border-red-600', val: 'red' },
                    { name: 'あお', code: 'text-blue-500', bg: 'bg-blue-400', border: 'border-blue-600', val: 'blue' },
                    { name: 'みどり', code: 'text-green-500', bg: 'bg-green-400', border: 'border-green-600', val: 'green' },
                    { name: 'きいろ', code: 'text-yellow-500', bg: 'bg-yellow-400', border: 'border-yellow-600', val: 'yellow' }
                ];
                
                let pool = allColors;
                if (this.state.difficulty === 'easy') pool = allColors.slice(0, 2); 

                const mode = Math.random() > 0.5 ? 'color' : 'text';
                const targetText = pool[Math.floor(Math.random() * pool.length)];
                const targetColor = pool[Math.floor(Math.random() * pool.length)];
                const correctAnswer = mode === 'color' ? targetColor.val : targetText.val;

                // Pro: Rotation / Distortion
                let transformStyle = '';
                if (this.state.difficulty === 'pro') {
                    const rot = Math.floor(Math.random() * 90) - 45; // -45 to 45
                    const scale = Math.random() > 0.5 ? 'scaleX(-1)' : 'scale(1)'; // Mirror sometimes
                    transformStyle = `transform: rotate(${rot}deg) ${scale};`;
                }

                const fontSize = this.state.difficulty === 'pro' ? 'text-[5rem]' : 'text-[4rem]';

                stage.innerHTML = `
                    <div class="inline-block bg-slate-100 px-4 py-1 rounded-full text-sm font-black text-slate-500 mb-4">
                        ${mode === 'color' ? '「色」は？' : '「読み」は？'}
                    </div>
                    <div class="${fontSize} font-black ${targetColor.code} leading-none drop-shadow-sm transition-all" style="${transformStyle}">${targetText.name}</div>
                `;

                // Pro: Shuffle Buttons
                let buttonOrder = [...pool];
                if (this.state.difficulty !== 'easy') { // Normal, Pro shuffle
                    buttonOrder.sort(() => Math.random() - 0.5);
                } else {
                     // Easy keep order for ease? No, standard is shuffle usually, let's keep standard shuffle
                     buttonOrder.sort(() => Math.random() - 0.5);
                }
                
                // For Pro, maybe shuffle even more aggressively or add dud buttons? 
                // Let's stick to shuffling. The Rotation is the main killer.

                buttonOrder.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = `${opt.bg} ${opt.border} text-white btn-beanbag text-xl font-black h-full flex items-center justify-center shadow-md`;
                    btn.innerText = opt.name;
                    btn.onclick = () => this.handleAnswer(opt.val === correctAnswer);
                    controls.appendChild(btn);
                });
            },

            renderDirection: function(stage, controls) {
                const dirs = ['up', 'down', 'left', 'right'];
                const icons = { up: 'fa-arrow-up', down: 'fa-arrow-down', left: 'fa-arrow-left', right: 'fa-arrow-right' };
                const actualDir = dirs[Math.floor(Math.random() * dirs.length)];
                
                let isReverse = false;
                let instructionText = "そのまま！";
                let colorClass = "text-slate-700";
                
                let targetDir = actualDir;

                if (this.state.difficulty === 'easy') {
                    isReverse = false;
                    instructionText = "そのまま！";
                    colorClass = "text-blue-500";
                    targetDir = actualDir;
                } else if (this.state.difficulty === 'normal') {
                    isReverse = Math.random() > 0.5;
                    instructionText = isReverse ? "反対！" : "そのまま！";
                    colorClass = isReverse ? "text-red-500" : "text-blue-500";
                    
                    if(isReverse) {
                        if (actualDir === 'up') targetDir = 'down';
                        if (actualDir === 'down') targetDir = 'up';
                        if (actualDir === 'left') targetDir = 'right';
                        if (actualDir === 'right') targetDir = 'left';
                    }
                } else {
                    // Pro: 4 Color Rules + Animation
                    // Blue=Same, Red=Reverse, Yellow=Right90, Green=Left90
                    const rules = [
                        { col: 'text-blue-500', type: 'same' }, 
                        { col: 'text-red-500', type: 'rev' },
                        { col: 'text-yellow-500', type: 'right90' },
                        { col: 'text-green-500', type: 'left90' }
                    ];
                    const rule = rules[Math.floor(Math.random() * rules.length)];
                    colorClass = rule.col;
                    
                    // Show rule hint text?
                    const ruleText = { same: 'そのまま', rev: '反対', right90: '右に90度', left90: '左に90度' };
                    instructionText = ruleText[rule.type];

                    if(rule.type === 'same') targetDir = actualDir;
                    else if(rule.type === 'rev') {
                        if (actualDir === 'up') targetDir = 'down';
                        if (actualDir === 'down') targetDir = 'up';
                        if (actualDir === 'left') targetDir = 'right';
                        if (actualDir === 'right') targetDir = 'left';
                    } else if(rule.type === 'right90') {
                        // Up->Right, Right->Down, Down->Left, Left->Up
                        if (actualDir === 'up') targetDir = 'right';
                        if (actualDir === 'right') targetDir = 'down';
                        if (actualDir === 'down') targetDir = 'left';
                        if (actualDir === 'left') targetDir = 'up';
                    } else if(rule.type === 'left90') {
                        // Up->Left, Left->Down, Down->Right, Right->Up
                        if (actualDir === 'up') targetDir = 'left';
                        if (actualDir === 'left') targetDir = 'down';
                        if (actualDir === 'down') targetDir = 'right';
                        if (actualDir === 'right') targetDir = 'up';
                    }
                }

                // Pro Animation
                const animClass = this.state.difficulty === 'pro' ? 'animate-spin-slow' : '';

                stage.innerHTML = `
                    <div class="inline-block bg-slate-100 px-4 py-1 rounded-full text-sm font-black mb-6 ${colorClass}">
                        ${instructionText}
                    </div>
                    <div class="text-[5rem] ${colorClass} drop-shadow-sm ${animClass}"><i class="fa-solid ${icons[actualDir]}"></i></div>
                `;

                dirs.forEach(d => {
                    const btn = document.createElement('button');
                    btn.className = `bg-white border-slate-200 text-slate-400 border-b-4 rounded-3xl text-3xl font-black h-full flex items-center justify-center shadow-sm active:translate-y-1 active:border-b-2 active:text-blue-500 transition-all`;
                    btn.innerHTML = `<i class="fa-solid ${icons[d]}"></i>`;
                    btn.onclick = () => this.handleAnswer(d === targetDir);
                    controls.appendChild(btn);
                });
            },

            renderMath: function(stage, controls) {
                // Easy: 1-9. Normal: 10-99. Pro: 3-step calculation
                let contentHTML = "";
                let isEven = false;

                if (this.state.difficulty === 'pro') {
                    // Calculation: A + B - C or A + B + C
                    const n1 = Math.floor(Math.random() * 20) + 1;
                    const n2 = Math.floor(Math.random() * 20) + 1;
                    const n3 = Math.floor(Math.random() * 10) + 1;
                    const op1 = Math.random() > 0.5 ? '+' : '-';
                    const op2 = Math.random() > 0.5 ? '+' : '-';
                    
                    let res = n1;
                    if(op1 === '+') res += n2; else res -= n2;
                    if(op2 === '+') res += n3; else res -= n3;
                    
                    // Display string e.g. "12 + 5 - 3"
                    contentHTML = `<div class="text-3xl">${n1} ${op1} ${n2} ${op2} ${n3}</div>`;
                    isEven = res % 2 === 0;
                } else {
                    const max = this.state.difficulty === 'easy' ? 9 : 99;
                    const num = Math.floor(Math.random() * max) + 1;
                    isEven = num % 2 === 0;
                    contentHTML = `<div class="text-[3.5rem]">${num}</div>`;
                }

                stage.innerHTML = `
                    <div class="text-sm font-black text-slate-400 mb-4">偶数？奇数？</div>
                    <div class="w-40 h-40 flex items-center justify-center bg-white border-4 border-dashed border-slate-200 rounded-full font-black text-slate-700">
                        ${contentHTML}
                    </div>
                `;
                
                const mkBtn = (label, sub, col, check) => {
                    const btn = document.createElement('button');
                    const colorClass = col === 'blue' ? 'bg-blue-400 border-blue-600' : 'bg-red-400 border-red-600';
                    btn.className = `${colorClass} text-white btn-beanbag text-lg font-black h-full py-4 flex flex-col items-center justify-center shadow-md`;
                    btn.innerHTML = `${label}<span class="text-xs opacity-80">${sub}</span>`;
                    btn.onclick = () => this.handleAnswer(check);
                    controls.appendChild(btn);
                };
                mkBtn('偶数', '(2,4,6...)', 'blue', isEven);
                mkBtn('奇数', '(1,3,5...)', 'red', !isEven);
            },

            handleAnswer: function(isCorrect) {
                if (!this.state.isPlaying) return;
                const stage = document.getElementById('game-stage');
                if (isCorrect) {
                    let points = 10;
                    if(this.state.difficulty === 'normal') points = 15;
                    if(this.state.difficulty === 'pro') points = 30; // High score for Pro
                    this.state.score += points;
                    
                    stage.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 200 });
                } else {
                    stage.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 300 });
                }
                document.getElementById('score-display').innerText = this.state.score;
                this.nextRound();
            },

            endGame: function() {
                this.state.isPlaying = false;
                clearInterval(this.state.timerInterval);
                UserData.recordPlay(this.state.score);

                document.getElementById('final-score').innerText = this.state.score;
                document.getElementById('result-difficulty').innerText = `MODE: ${this.state.difficulty.toUpperCase()}`;
                
                let feedback = "ドンマイ！";
                const base = this.state.difficulty === 'pro' ? 400 : (this.state.difficulty === 'normal' ? 200 : 100);
                
                if (this.state.score > base) feedback = "すごい！天才かも！？";
                else if (this.state.score > base/2) feedback = "いい感じ！脳が起きたね！";
                else feedback = "ナイスファイト！";
                document.getElementById('feedback-text').innerText = feedback;

                this.switchView('result');
                const stampArea = document.getElementById('result-stamp-area');
                stampArea.classList.remove('animate-stamp');
                void stampArea.offsetWidth; 
                setTimeout(() => stampArea.classList.add('animate-stamp'), 500);
            },
            
            renderCalendar: function() {
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                document.getElementById('calendar-month-label').innerText = `${year}年 ${month + 1}月`;
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const grid = document.getElementById('calendar-days');
                grid.innerHTML = '';
                const userData = UserData.load();
                
                for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = new Date(year, month, d).toDateString();
                    const cell = document.createElement('div');
                    cell.className = 'calendar-day';
                    cell.innerText = d;
                    if (userData.dates.includes(dateStr)) {
                        cell.classList.add('stamped');
                        const mark = document.createElement('i');
                        mark.className = 'fa-solid fa-certificate stamp-mark';
                        cell.appendChild(mark);
                        cell.style.color = '#854d0e';
                    }
                    grid.appendChild(cell);
                }
                document.getElementById('streak-count').innerHTML = `${userData.dates.length} <span class="text-sm">回</span>`;
            }
        };

        window.onload = function() {
            const liffId = "LIFF_ID_PLACEHOLDER"; 
            if (typeof liff !== 'undefined') {
                liff.init({ liffId: liffId }).then(() => {
                    if (!liff.isLoggedIn() && liff.isInClient()) liff.login();
                    else liff.getProfile().then(p => { UserData.setUserId(p.userId); app.init(); }).catch(() => app.init());
                }).catch(() => app.init());
            } else {
                app.init();
            }
        };
    </script>
</body>
</html>
